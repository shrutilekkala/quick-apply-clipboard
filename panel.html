<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickApply Clipboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">JOB SEARCH TOOLKIT</p>
        <h1>QuickApply</h1>
      </div>
      <div class="header-actions">
        <button id="uploadButton" class="header-secondary" type="button">Upload file</button>
        <button id="addButton" class="primary compact" type="button">+ Add</button>
        <input id="fileInput" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden />
      </div>
    </header>

    <main>
      <label class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Search snippets and files…" autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </label>

      <nav id="categoryFilters" class="category-filters" aria-label="Snippet categories"></nav>

      <section class="toolbar">
        <p id="resultCount">0 saved items</p>
        <div class="toolbar-actions">
          <button id="exportButton" class="text-button" type="button">Export text</button>
          <button id="importButton" class="text-button" type="button">Import text</button>
          <input id="importInput" type="file" accept="application/json" hidden />
        </div>
      </section>

      <section id="snippetList" class="snippet-list" aria-live="polite"></section>

      <section id="emptyState" class="empty-state" hidden>
        <div class="empty-icon">✦</div>
        <h2>No saved items found</h2>
        <p>Save reusable text, URLs, PDF files, and Word documents in one local workspace.</p>
        <button id="emptyAddButton" class="primary" type="button">Create your first snippet</button>
      </section>
    </main>

    <dialog id="editorDialog">
      <form id="editorForm" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">REUSABLE CONTENT</p>
            <h2 id="dialogTitle">Add snippet</h2>
          </div>
          <button id="closeDialog" class="icon-button" type="button" aria-label="Close">×</button>
        </div>

        <input id="snippetId" type="hidden" />

        <label>
          Label
          <input id="titleInput" maxlength="80" required placeholder="LinkedIn URL" />
        </label>

        <label>
          Category
          <select id="categoryInput">
            <option>Contact</option>
            <option>URLs</option>
            <option>Application Answers</option>
            <option>Project Swaps</option>
            <option>Resume Bullets</option>
            <option>Inbox</option>
            <option value="__custom">+ New category…</option>
          </select>
        </label>

        <label id="customCategoryWrap" hidden>
          New category
          <input id="customCategoryInput" maxlength="40" placeholder="e.g., Work authorization" />
        </label>

        <label>
          Content
          <textarea id="valueInput" rows="8" required placeholder="Paste the text you reuse frequently"></textarea>
        </label>

        <label class="check-row">
          <input id="favoriteInput" type="checkbox" />
          Pin to favorites
        </label>

        <div class="dialog-actions">
          <button id="cancelButton" class="secondary" type="button">Cancel</button>
          <button class="primary" type="submit">Save snippet</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="panel.js"></script>
  </body>
</html>
